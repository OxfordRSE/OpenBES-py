name: Test and Publish Package

on:
  push:
    branches: [main, "actions/**"]
    tags: ["**"]
  pull_request:
    branches: [main]
  release:
    types: [created]

jobs:
  install_and_run:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12, 3.13]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run example
        run: python .github/workflows/scripts/run_example.py

  build:
    runs-on: ubuntu-latest
    outputs:
      dist-path: ${{ steps.save.outputs.dist-path }}
      version: ${{ steps.setver.outputs.version }}
      name: ${{ steps.setver.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install build backend
        run: python -m pip install --upgrade pip build

      - name: Read version, bump .devN for TestPyPI if needed
        id: setver
        run: |
          python - <<'PY'
          import tomllib, json, re, sys, urllib.request, urllib.error
          from pathlib import Path
          p = Path('pyproject.toml')
          doc = tomllib.loads(p.read_bytes())
          name = doc.get('project',{}).get('name') or doc.get('tool',{}).get('poetry',{}).get('name')
          base_version = doc.get('project',{}).get('version') or doc.get('tool',{}).get('poetry',{}).get('version')
          if not name or not base_version:
              print("ERROR: missing name/version", file=sys.stderr); sys.exit(1)
          is_tag = ( '${{ github.ref }}'.startswith('refs/tags/') )
          new_version = base_version
          if not is_tag:
              # query TestPyPI for existing releases
              try:
                  j = json.loads(urllib.request.urlopen(f'https://test.pypi.org/pypi/{name}/json', timeout=10).read().decode())
                  releases = list(j.get('releases',{}).keys())
              except Exception:
                  releases = []
              prefix = base_version + ".dev"
              devs = [int(r[len(prefix):]) for r in releases if r.startswith(prefix) and r[len(prefix):].isdigit()]
              nextdev = max(devs)+1 if devs else 1
              new_version = f"{base_version}.dev{nextdev}"
              txt = p.read_text()
              txt_new, n = re.subn(r'(?m)^(version\s*=\s*)\"[^\"]+\"', r'\1"' + new_version + '"', txt, count=1)
              if n == 0:
                  print("ERROR: couldn't rewrite version", file=sys.stderr); sys.exit(1)
              p.write_text(txt_new)
          # output for later jobs
          print(f"::set-output name=name::{name}")
          print(f"::set-output name=version::{new_version}")
          PY

      - name: Build distributions
        run: python -m build --sdist --wheel

      - name: Save artifacts path
        id: save
        run: echo "::set-output name=dist-path::dist"

  pypi-publish:
    name: Upload release to PyPI
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/openbes
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  pypi-test-publish:
    name: Upload release to PyPI [Test]
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypiTest
      url: https://pypi.org/p/openbes
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/