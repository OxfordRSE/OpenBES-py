name: Test and Publish Package

on:
  push:
    branches: [main, "actions/**"]
    tags: ["**"]
  pull_request:
    branches: [main]
  release:
    types: [created]

concurrency:
  group: package-test-and-publish-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  install_and_run:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12, 3.13]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Check version
        if: matrix.python-version == '3.11'
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          echo "TAG is $TAG"
          # Check that the package version matches the tag
          pkg_version=$(pip show openbes | grep ^Version: | awk '{print $2}')
          echo "Package version: $pkg_version"
          # strip to basic version
          tag_version=$(echo "$TAG" | grep -oE v[0-9.]+ || true)
          echo "Tag version: $tag_version"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "Version mismatch: package version is $pkg_version but tag is $tag_version"
            echo "(full tag: $TAG)"
            if [ "${{ github.event_name }}" = "release" ]; then
              exit 1
            fi
          fi

      - name: Run example
        run: python .github/workflows/scripts/run_example.py

  build-and-publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.setver.outputs.version }}
      name: ${{ steps.setver.outputs.name }}
    needs: install_and_run
    environment: ${{ github.event_name == 'release' && 'pypi' || 'pypiTest' }}
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install build backend
        run: python -m pip install --upgrade pip build

      - name: Read version, bump .devN for TestPyPI if needed
        id: setver
        run: python .github/workflows/scripts/update_pyproject.py "${{ github.ref }}"

      - name: Build distributions
        run: python -m build --sdist --wheel

      - name: Inspect distributions
        run: |
          set -euo pipefail

          # Find the universal wheel (fail if none)
          wheel=$(ls dist/openbes-*-py3-none-any.whl 2>/dev/null | head -n1 || true)
          if [ -z "${wheel:-}" ]; then
            echo "ERROR: No py3-none-any wheel found in dist/" >&2
            ls -la dist || true
            exit 1
          fi
          
          echo "=== Wheel file ==="
          echo "$wheel"
          
          echo "=== Wheel contents ==="
          unzip -l "$wheel"
          
          echo "=== WHEEL metadata ==="
          # -Z1 reliably prints only file paths (if available)
          if unzip -Z1 "$wheel" >/dev/null 2>&1; then
            wheel_file=$(unzip -Z1 "$wheel" | grep -m1 '\.dist-info/WHEEL$')
          else
            # fallback: extract the 4th col which is the path
            wheel_file=$(unzip -l "$wheel" | awk '{print $4}' | grep -m1 '\.dist-info/WHEEL$')
          fi
          
          if [ -z "$wheel_file" ]; then
            echo "ERROR: Could not locate the WHEEL file inside archive." >&2
            exit 1
          fi
          
          unzip -p "$wheel" "$wheel_file"

      - name: Install twine
        run: python -m pip install --upgrade pip twine

      - name: Publish
        run: |          
          if [ "${{ github.event_name }}" = "release" ]; then
            python -m twine upload dist/*
          else
            python -m twine upload dist/* --repository-url https://test.pypi.org/legacy/
          fi
