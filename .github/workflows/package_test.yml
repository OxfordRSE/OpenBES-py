name: Test and Publish Package

on:
  push:
    branches: [main, "actions/**"]
    tags: ["**"]
  pull_request:
    branches: [main]
  release:
    types: [created]

jobs:
  install_and_run:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12, 3.13]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run example
        run: python .github/workflows/scripts/run_example.py

  build:
    runs-on: ubuntu-latest
    outputs:
      dist-path: ${{ steps.save.outputs.dist-path }}
      version: ${{ steps.setver.outputs.version }}
      name: ${{ steps.setver.outputs.name }}
    needs: install_and_run
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install build backend
        run: python -m pip install --upgrade pip build

      - name: Read version, bump .devN for TestPyPI if needed
        id: setver
        run: python .github/workflows/scripts/set_version.py "${{ github.ref }}"

      - name: Build distributions
        run: python -m build --sdist --wheel

      - name: Save artifacts path
        id: save
        run: echo "dist-path=$(realpath dist)" >> $GITHUB_OUTPUT

  pypi-publish:
    name: Upload release to PyPI
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/p/openbes
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  pypi-test-publish:
    name: Upload release to PyPI [Test]
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypiTest
      url: https://pypi.org/p/openbes
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/