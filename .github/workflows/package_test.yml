name: Test and Publish Package

on:
  push:
    branches: [main, "actions/**"]
    tags: ["**"]
  pull_request:
    branches: [main]
  release:
    types: [created]

jobs:
  install_and_run:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12, 3.13]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run example
        run: python .github/workflows/scripts/run_example.py

  build-and-publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.setver.outputs.version }}
      name: ${{ steps.setver.outputs.name }}
    needs: install_and_run
    environment: ${{ github.event_name == 'release' && 'pypi' || 'pypiTest' }}
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install build backend
        run: python -m pip install --upgrade pip build

      - name: Read version, bump .devN for TestPyPI if needed
        id: setver
        run: python .github/workflows/scripts/update_pyproject.py "${{ github.ref }}"

      - name: Build distributions
        run: python -m build --sdist --wheel

      - name: Publish
        run: |
          echo "Release detected: ${GITHUB_EVENT_NAME} ${GITHUB_REF}"
          unzip -p dist/openbes-0.1.1-py3-none-any.whl openbes-0.1.1.dist-info/WHEEL
          
          pip install twine
          if [ "${{ github.event_name }}" = "release" ]; then
            python -m twine upload dist/*
          else
            python -m twine upload dist/* --repository-url https://test.pypi.org/legacy/
          fi
