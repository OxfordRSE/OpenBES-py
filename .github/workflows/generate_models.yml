name: Generate Specification Models
on:
  push:
    paths: ["src/openbes/schemas/OpenBES.schema.json"]
  workflow_dispatch:

jobs:
    generate_models:
      permissions:
        contents: write
      runs-on: ubuntu-latest
      steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Generate models from schemas
        run: |
          # Create custom header file
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%S%:z")
          DMGC_VERSION=$(datamodel-codegen --version)
          cat > .header.tmp.txt <<EOL
          """
          Auto-generated by datamodel-codegen. 
          
          DO NOT EDIT MANUALLY.
          
          timestamp: $TIMESTAMP
          
          version: $DMGC_VERSION
          
          The contents of this file are updated automatically when changes to ./src/openbes/schemas/OpenBES.schema.json 
          are pushed to GitHub using the ./github/workflows/generate_models.yml Action. 
          To make changes to the models, the first step is to try updating OpenBES.schema.json, 
          which is the single source of truth for the simulation specification. 
          
          If that does not suffice for your needs, you can add post-hoc wrapper functionality in 
          ./src/openbes/schemas/__init__.py to change how the model code is exported.
          
          """
          EOL
          
          cat .header.tmp.txt
          
          # One-line version for copy-paste if running manually (won't include the custom header):
          datamodel-codegen --input src/openbes/schemas/OpenBES.schema.json --input-file-type jsonschema --output src/openbes/schemas/generated/models.py --output-model-type pydantic_v2.BaseModel --class-name OpenBESSpecificationV2 --use-standard-collections --formatters isort --formatters ruff-check --formatters ruff-format --use-default-kwarg --keyword-only --target-python-version 3.11 --use-double-quotes --custom-file-header-path .header.tmp.txt 
          
          # datamodel-codegen \
          #   --input src/openbes/schemas/OpenBES.schema.json \ 
          #   --input-file-type jsonschema \ 
          #   --output src/openbes/schemas/generated/models.py \ 
          #   --output-model-type pydantic_v2.BaseModel \ 
          #   --class-name OpenBESSpecificationV2 \
          #   --use-standard-collections \ 
          #   --formatters isort \
          #   --formatters ruff-check \
          #   --formatters ruff-format \
          #   --use-default-kwarg \
          #   --keyword-only \
          #   --target-python-version 3.11 \
          #   --use-double-quotes \
          #   --custom-file-header-path .header.tmp.txt
          
          rm .header.tmp.txt
            

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/openbes/schemas/generated
          if ! git diff --cached --quiet; then
              git commit -m "ci: Auto-generate models from schemas"
              git push origin HEAD:${{ github.ref }}
          else
              echo "No changes to commit"
          fi
